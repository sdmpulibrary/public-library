<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>In the News - S.D.M. P.U. College Library</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;700&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c1:#0f5c63;--c2:#07363b;--gold:#d4a017;--bg:#faf7ef;--ink:#1a1a1a;--mut:#5d5d5d;--line:#e2dccb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3","Noto Sans Kannada",sans-serif;font-size:15px}
.kn{font-family:"Noto Sans Kannada","Source Sans 3",sans-serif}
header{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;padding:14px 16px;border-bottom:4px solid var(--gold)}
header .in{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header b{font-size:22px}header small{display:block;opacity:.85}header a{color:#fff;font-weight:700}
main{max-width:1100px;margin:0 auto;padding:14px 16px 40px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.bar input,.bar select{padding:9px 12px;border:1px solid #cfc6ad;border-radius:999px;font:inherit;flex:1;min-width:160px;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chips button{border:1.5px solid var(--c1);background:#fff;color:var(--c1);border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}.chips button.on{background:var(--c1);color:#fff}.chips .kn{font-weight:400;font-size:13px}
.nw .sc{display:inline-block;background:#eef0fb;color:#273a8a;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;margin-bottom:4px}
.run{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 0 12px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.run h3{margin:0 14px 8px;font-size:16px;color:var(--c1);display:flex;align-items:center;gap:8px}.run h3 small{font-weight:400;color:var(--mut);font-size:13px}
.run .vw{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.run .tr{display:flex;gap:14px;width:max-content;animation:runl var(--dur,60s) linear infinite;padding:0 7px}
.run .vw:hover .tr,.run .vw.hold .tr{animation-play-state:paused}
@keyframes runl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.run .it{width:170px;flex:0 0 170px;cursor:pointer;background:#faf7ef;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.run .it img{width:100%;height:200px;object-fit:cover;object-position:top;display:block;background:#fff}
.run .it div{padding:6px 8px;font-size:12px;line-height:1.3}.run .it b{color:var(--c1);display:block;font-size:13px}
.run .it span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (prefers-reduced-motion:reduce){.run .vw{overflow-x:auto}.run .tr{animation:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.nw{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nw .im{height:230px;background:#f3efe2;cursor:zoom-in;position:relative}.nw .im img{width:100%;height:100%;object-fit:cover;object-position:top}
.nw .im span{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;border-radius:999px;padding:2px 9px}
.nw .tx{padding:10px 12px}.nw .p{font-weight:800;color:var(--c1)}.nw .d{font-size:13px;color:var(--mut)}.nw .w{margin-top:6px;line-height:1.35}
.nw .hl{display:inline-block;background:#fff3c4;color:#7a5c00;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;margin-left:6px}
.empty{background:#fff;border:1px dashed #cfc6ad;border-radius:12px;padding:30px;text-align:center;color:var(--mut)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:99;flex-direction:column;padding:14px}
.lb img{max-width:96vw;max-height:84vh;background:#fff;border-radius:6px}.lb .cap{color:#fff;margin-top:8px;text-align:center;font-size:14px;max-width:90vw}
.lb button{position:absolute;background:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:22px;cursor:pointer}
.lb .x{top:10px;right:14px}.lb .pv{left:10px;top:50%}.lb .nx{right:10px;top:50%}
</style></head><body>
<header><div class="in"><div><b>&#x1F4F0; In the News <span class="kn">&#x0CAA;&#x0CA4;&#x0CCD;&#x0CB0;&#x0CBF;&#x0C95;&#x0CC6;&#x0C97;&#x0CB3;&#x0CB2;&#x0CCD;&#x0CB2;&#x0CBF; &#x0CA8;&#x0CBE;&#x0CB5;&#x0CC1;</span></b><small>S.D.M. P.U. College, Honnavar &middot; Advocate Shri V. G. Hegde Kaikatgeri Memorial Library and Information Centre</small></div>
<a href="../">&larr; Home</a></div></header>
<main>
<div class="run" id="run" style="display:none"><h3>&#x1F4F0; All cuttings <small>tap any cutting to read it &middot; <span class="kn">&#x0C93;&#x0CA6;&#x0CB2;&#x0CC1; &#x0C92;&#x0CA4;&#x0CCD;&#x0CA4;&#x0CBF;</span></small></h3><div class="vw" id="vw"><div class="tr" id="tr"></div></div></div>
<div class="chips" id="chips"><button class="on" data-s="">All <span class="kn">&#x0C8E;&#x0CB2;&#x0CCD;&#x0CB2;&#x0CBE;</span></button><button data-s="Students">Students <span class="kn">&#x0CB5;&#x0CBF;&#x0CA6;&#x0CCD;&#x0CAF;&#x0CBE;&#x0CB0;&#x0CCD;&#x0CA5;&#x0CBF;&#x0C97;&#x0CB3;&#x0CC1;</span></button><button data-s="Staff">Staff <span class="kn">&#x0CB8;&#x0CBF;&#x0CAC;&#x0CCD;&#x0CAC;&#x0C82;&#x0CA6;&#x0CBF;</span></button><button data-s="College News">College News <span class="kn">&#x0C95;&#x0CBE;&#x0CB2;&#x0CC7;&#x0C9C;&#x0CC1; &#x0CB8;&#x0CC1;&#x0CA6;&#x0CCD;&#x0CA6;&#x0CBF;</span></button><button data-s="Library News">Library News <span class="kn">&#x0C97;&#x0CCD;&#x0CB0;&#x0C82;&#x0CA5;&#x0CBE;&#x0CB2;&#x0CAF; &#x0CB8;&#x0CC1;&#x0CA6;&#x0CCD;&#x0CA6;&#x0CBF;</span></button><button data-s="Alumni">Alumni <span class="kn">&#x0CB9;&#x0CB3;&#x0CC6;&#x0CAF; &#x0CB5;&#x0CBF;&#x0CA6;&#x0CCD;&#x0CAF;&#x0CBE;&#x0CB0;&#x0CCD;&#x0CA5;&#x0CBF;&#x0C97;&#x0CB3;&#x0CC1;</span></button><button data-s="General / Govt">General / Govt <span class="kn">&#x0CB8;&#x0CBE;&#x0CAE;&#x0CBE;&#x0CA8;&#x0CCD;&#x0CAF; / &#x0CB8;&#x0CB0;&#x0C95;&#x0CBE;&#x0CB0;</span></button></div>
<div class="bar"><select id="type" style="display:none"><option value="">All types</option><option>Sports</option><option>Academics</option><option>Special</option><option>Events</option><option>Other</option></select><input id="q" placeholder="Search matter or newspaper... / ಹುಡುಕಿ"><select id="paper"><option value="">All newspapers</option></select></div>
<div class="grid" id="grid"><div class="empty">Loading... <span class="kn">&#x0CA4;&#x0CC6;&#x0CB0;&#x0CC6;&#x0CAF;&#x0CC1;&#x0CA4;&#x0CCD;&#x0CA4;&#x0CBF;&#x0CA6;&#x0CC6;...</span></div></div>
</main>
<div class="lb" id="lb" onclick="if(event.target===this)closeLb()"><button class="x" onclick="closeLb()" aria-label="Close">&times;</button>
  <button class="pv" onclick="step(-1)" aria-label="Previous">&#8249;</button><button class="nx" onclick="step(1)" aria-label="Next">&#8250;</button>
  <img id="lbi" alt=""><div class="cap" id="cap"></div></div>
<script>
var API='https://script.google.com/macros/s/AKfycbwEMCy15KFV5YvYZMklzSsqDIaEd3cEzcj7TctJtLPkoXYzIp2_ywisicr6Yf71PTbM/exec',ALL=[],cur={i:0,n:0},SEC='',TYPED={'Students':1,'Staff':1,'Alumni':1};
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';';});}
function call(fn,args){return fetch(API,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[]})})
  .then(function(r){return r.json();}).then(function(j){if(j&&j.ok)return j.result;throw new Error((j&&j.error)||'Server error');});}
function draw(){var q=$('q').value.trim().toLowerCase(),p=$('paper').value,t=TYPED[SEC]?$('type').value:'';$('type').style.display=TYPED[SEC]?'':'none';
  var L=ALL.map(function(a,i){a.i=i;return a;}).filter(function(a){return (!SEC||a.sec===SEC)&&(!t||a.type===t)&&(!p||a.paper===p)&&(!q||(a.paper+' '+a.what+' '+a.date).toLowerCase().indexOf(q)>=0);});
  $('grid').innerHTML=L.length?L.map(function(a){return '<div class="nw">'+(a.thumbs[0]?'<div class="im" onclick="openLb('+a.i+',0)"><img src="'+a.thumbs[0]+'" alt="Newspaper cutting">'+(a.n>1?'<span>'+a.n+' pictures</span>':'')+'</div>':'')+
    '<div class="tx"><span class="sc">'+esc((a.sec||'')+(a.type?' - '+a.type:''))+'</span><div class="p">'+esc(a.paper)+(a.hl?'<span class="hl">&#x2B50; Highlight</span>':'')+'</div><div class="d">'+esc(a.date)+'</div><div class="w">'+esc(a.what)+'</div></div></div>';}).join('')
    :'<div class="empty">'+(ALL.length?'Nothing matches your search.':'No newspaper cuttings just now.')+'</div>';}
function openLb(i,n){cur={i:i,n:n};var a=ALL[i],cap=a.paper+', '+a.date+' - picture '+(n+1)+' of '+a.thumbs.length;
  $('lb').style.display='flex';$('lbi').src=a.thumbs[n];$('cap').textContent=cap+' (loading full size...)';
  call('acCutting',[a.k,n,'news']).then(function(src){if(cur.i===i&&cur.n===n){$('lbi').src=src;$('cap').textContent=cap+' — '+a.what;}}).catch(function(){$('cap').textContent=cap;});}
function step(d){var a=ALL[cur.i];if(a)openLb(cur.i,(cur.n+d+a.thumbs.length)%a.thumbs.length);}
function closeLb(){$('lb').style.display='none';}
document.addEventListener('keydown',function(e){if($('lb').style.display!=='flex')return;if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);});
$('q').oninput=draw;$('paper').onchange=draw;$('type').onchange=draw;
$('chips').onclick=function(e){var b=e.target.closest('button');if(!b)return;SEC=b.dataset.s;[].forEach.call(this.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b);});$('type').value='';draw();};
try{var hs=decodeURIComponent((location.hash||'').slice(1));if(hs){SEC=hs;}}catch(e){}
function runDraw(){var L=ALL.filter(function(a){return a.thumbs[0]&&a.hl;}).concat(ALL.filter(function(a){return a.thumbs[0]&&!a.hl;}));if(!L.length){$('run').style.display='none';return;}
  var one=L.map(function(a){return '<div class="it" onclick="openLb('+ALL.indexOf(a)+',0)"><img src="'+a.thumbs[0]+'" alt="Newspaper cutting" loading="lazy"><div><b>'+(a.hl?'&#x2B50; ':'')+esc(a.paper)+'</b>'+esc(a.date)+'<span>'+esc(a.what)+'</span></div></div>';}).join('');
  var reps=Math.max(1,Math.ceil(8/L.length));var half='';for(var i=0;i<reps;i++)half+=one;
  $('tr').innerHTML=half+half;$('tr').style.setProperty('--dur',Math.max(25,L.length*reps*5)+'s');$('run').style.display='block';}
$('vw').addEventListener('touchstart',function(){this.classList.add('hold');},{passive:true});
$('vw').addEventListener('touchend',function(){var v=this;setTimeout(function(){v.classList.remove('hold');},2500);});
call('nwPublic',[false]).then(function(r){ALL=r||[];var ps={};ALL.forEach(function(a){ps[a.paper]=1;});
  $('paper').innerHTML='<option value="">All newspapers</option>'+Object.keys(ps).sort().map(function(p){return '<option>'+esc(p)+'</option>';}).join('');[].forEach.call($('chips').querySelectorAll('button'),function(x){x.classList.toggle('on',x.dataset.s===SEC);});draw();runDraw();})
  .catch(function(){$('grid').innerHTML='<div class="empty">Could not load. Please check your internet and try again.</div>';});
</script>
</body></html>
